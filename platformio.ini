; PlatformIO Project Configuration File
;
; Two images: ESP32-S3-N16R8 host + ESP32-C6 Zigbee slave (ADR 0003).

[platformio]
default_envs = esp32-s3-host, esp32-c6-slave

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web_assets.py
lib_deps =
    knolleary/PubSubClient@2.8
    mlesniew/PicoMQTT@1.3.0
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

[env:esp32-s3-host]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/host_s3_16MB.csv
board_build.filesystem_partition = spiffs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_ROLE_HOST=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
build_src_filter =
    +<*>
    -<ZigbeeCoordinator.cpp>
lib_ignore =
    Zigbee

[env:esp32-c6-slave]
board = esp32-c6-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/zigbee_zczr_16MB.csv
board_build.filesystem_partition = spiffs
build_flags =
    -DBOARD_ROLE_SLAVE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DZIGBEE_MODE_ZCZR
    -DCORE_DEBUG_LEVEL=3
    -Wl,-lesp_zb_api.zczr
    -Wl,-lzboss_stack.zczr
    -Wl,-lzboss_port.native
