; PlatformIO Project Configuration File
;
; ESP32-C6-DevKitC-1 N16 — Zigbee coordinator + WiFi MQTT gateway
; CLion: open this folder with the PlatformIO plugin (or generated CMake).

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/zigbee_zczr_16MB.csv
board_build.filesystem_partition = spiffs
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DZIGBEE_MODE_ZCZR
    -DCORE_DEBUG_LEVEL=3
    -Wl,-lesp_zb_api.zczr
    -Wl,-lzboss_stack.zczr
    -Wl,-lzboss_port.native

lib_deps =
    knolleary/PubSubClient@2.8
    mlesniew/PicoMQTT@1.3.0
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
